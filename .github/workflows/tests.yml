name: tests

on:
  push:
  pull_request:

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit + integration suites
        run: python -m pytest -m "unit or integration" -ra
        # The contract suite needs real API keys and is never run in CI.
